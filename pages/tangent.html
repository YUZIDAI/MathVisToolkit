<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>切线斜率探索器</title>
    <style>
        :root {
            --bg: #0b0b1a; --card-bg: #151530; --border: #252550;
            --text: #d8d8f0; --text-secondary: #8888b0;
            --accent-blue: #4f9fcf; --accent-red: #e05161; --accent-green: #4caf84;
            --accent-orange: #ff8c42; --accent-cyan: #48c9b0; --accent-purple: #b87fd9;
            --display-bg: #0a0a20; --btn-bg: #1e1e40; --btn-hover: #2e2e60;
            --graph-bg: #0d1117;
            --mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
        }
        [data-theme="light"] {
            --bg: #f0f2f5; --card-bg: #ffffff; --border: #d8dce3;
            --text: #1a1a2e; --text-secondary: #666680;
            --display-bg: #f5f6fa; --btn-bg: #e8ecf1; --btn-hover: #d8dce3;
            --graph-bg: #ffffff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'PingFang SC', system-ui, sans-serif;
            background: var(--bg); color: var(--text);
            display: flex; flex-direction: column; height: 100vh; overflow: hidden; user-select: none;
        }
        .header {
            padding: 8px 18px; background: rgba(0,0,0,0.5);
            display: flex; justify-content: space-between; align-items: center; gap: 12px;
            border-bottom: 1px solid var(--border); backdrop-filter: blur(10px);
            z-index: 10; flex-shrink: 0;
        }
        .header-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
        .header-left label { font-weight: 600; font-size: 0.82rem; white-space: nowrap; color: var(--accent-orange); }
        .expr-input {
            flex: 1; min-width: 120px; max-width: 300px; padding: 6px 10px;
            border: 1px solid var(--border); border-radius: 6px;
            background: var(--display-bg); color: var(--text); font-family: var(--mono);
            font-size: 0.85rem; outline: none;
        }
        .expr-input:focus { border-color: var(--accent-blue); }
        .header-links { display: flex; gap: 10px; align-items: center; flex-shrink: 0; }
        .header-links a, .header-links button {
            color: var(--accent-blue); text-decoration: none; font-size: 0.78rem;
            cursor: pointer; background: none; border: none; padding: 4px 8px;
            border-radius: 4px; transition: all 0.2s; white-space: nowrap;
        }
        .header-links a:hover, .header-links button:hover { color: #fff; background: var(--btn-hover); }
        .theme-toggle {
            padding: 5px 10px; border: 1px solid var(--border); border-radius: 16px;
            background: var(--card-bg); color: var(--text); cursor: pointer;
            font-size: 0.75rem; transition: all 0.2s;
        }
        .theme-toggle:hover { border-color: var(--accent-blue); }
        .btn-apply { padding: 6px 14px; border: none; border-radius: 6px; background: var(--accent-blue); color: #fff; font-weight: 600; font-size: 0.78rem; cursor: pointer; }
        .btn-apply:hover { filter: brightness(1.15); }

        .graph-panel {
            flex: 1; background: var(--graph-bg); position: relative; overflow: hidden;
            border: 1px solid var(--border); margin: 8px; border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        #graphCanvas { display: block; width: 100%; height: 100%; }
        .info-overlay {
            position: absolute; top: 12px; left: 14px;
            background: rgba(0,0,0,0.75); padding: 8px 14px; border-radius: 8px;
            font-family: var(--mono); font-size: 0.78rem; pointer-events: none;
            border: 1px solid rgba(255,255,255,0.12); line-height: 1.6;
        }
        .info-overlay .label-text { color: #aaa; }
        .info-overlay .value-text { color: var(--accent-orange); font-weight: bold; }
        .info-overlay .slope-text { color: var(--accent-red); font-weight: bold; }
        .hint-bar {
            position: absolute; bottom: 8px; right: 12px;
            color: #555; font-size: 0.68rem; pointer-events: none;
        }
    </style>
    <script src="../js/common.js"></script>
</head>
<body>
<div class="header">
    <div class="header-left">
        <label for="exprInput">f(x) =</label>
        <input type="text" class="expr-input" id="exprInput" value="x^3-3*x" placeholder="输入表达式..." spellcheck="false" onkeydown="if(event.key==='Enter')applyFunction()">
        <button class="btn-apply" onclick="applyFunction()">应用</button>
    </div>
    <div class="header-links">
        <button onclick="resetAll()">🔄 重置</button>
        <button onclick="exportImage()">📸 导出</button>
        <button onclick="showHelp()">❓ 帮助</button>
        <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
    </div>
</div>
<div class="graph-panel" id="graphContainer">
    <canvas id="graphCanvas"></canvas>
    <div class="info-overlay" id="infoBox">
        <span class="label-text">📍 </span><span class="value-text" id="infoPoint">x=1.50, y=-1.12</span><br>
        <span class="label-text">📈 斜率：</span><span class="slope-text" id="infoSlope">m=3.75</span>
    </div>
    <div class="hint-bar">🖱️ 拖拽红点 | 滚轮缩放 | 右键平移</div>
</div>

<script>
(function() {
    const canvas = document.getElementById('graphCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('graphContainer');
    const exprInput = document.getElementById('exprInput');

    let xMin = -5, xMax = 5, yMin = -6, yMax = 6;
    let draggingPoint = false, panning = false, panStart = null;
    let pointX = 1.5, pointY = 0;
    let currentFn = Common.compileExpr(exprInput.value);

    // URL参数
    (function() {
        const urlParams = new URLSearchParams(window.location.search);
        const passedFunc = urlParams.get('func');
        if (passedFunc) {
            const decoded = decodeURIComponent(passedFunc);
            exprInput.value = decoded;
            setTimeout(() => {
                const fn = Common.compileExpr(decoded);
                if (fn) { currentFn = fn; pointX = 1.5; draw(); }
            }, 300);
        }
    })();

    // 主题
    const savedTheme = localStorage.getItem('mathvislab_theme');
    if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
    window.toggleTheme = function() {
        const html = document.documentElement;
        const next = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        html.setAttribute('data-theme', next);
        localStorage.setItem('mathvislab_theme', next);
        draw();
    };

    function getRect() { return container.getBoundingClientRect(); }
    function toCanvasX(mx, W) { return ((mx - xMin) / (xMax - xMin)) * W; }
    function toCanvasY(my, H) { return H - ((my - yMin) / (yMax - yMin)) * H; }
    function toMathX(cx, W) { return xMin + (cx / W) * (xMax - xMin); }
    function toMathY(cy, H) { return yMax - (cy / H) * (yMax - yMin); }

    function draw() {
        const rect = getRect();
        const W = rect.width, H = rect.height;
        const dpr = window.devicePixelRatio || 1;
        if (canvas.width !== W * dpr || canvas.height !== H * dpr) {
            canvas.width = W * dpr; canvas.height = H * dpr;
            canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
            ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.scale(dpr, dpr);
        }
        const isLight = document.documentElement.getAttribute('data-theme') === 'light';
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = isLight ? '#f8f9fc' : '#0d1117';
        ctx.fillRect(0, 0, W, H);

        // 网格
        ctx.strokeStyle = isLight ? '#e0e0e0' : '#1a1a30';
        ctx.lineWidth = 0.5;
        const gsx = Math.pow(10, Math.floor(Math.log10(xMax - xMin))) / 5;
        const gsy = Math.pow(10, Math.floor(Math.log10(yMax - yMin))) / 5;
        for (let x = Math.floor(xMin / gsx) * gsx; x <= xMax; x += gsx) {
            ctx.beginPath(); ctx.moveTo(toCanvasX(x, W), 0); ctx.lineTo(toCanvasX(x, W), H); ctx.stroke();
        }
        for (let y = Math.floor(yMin / gsy) * gsy; y <= yMax; y += gsy) {
            ctx.beginPath(); ctx.moveTo(0, toCanvasY(y, H)); ctx.lineTo(W, toCanvasY(y, H)); ctx.stroke();
        }
        // 坐标轴
        const axisY = toCanvasY(0, H), axisX = toCanvasX(0, W);
        ctx.strokeStyle = isLight ? '#999' : '#888';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(0, axisY); ctx.lineTo(W, axisY); ctx.moveTo(axisX, 0); ctx.lineTo(axisX, H); ctx.stroke();
        ctx.fillStyle = isLight ? '#666' : '#aaa';
        ctx.font = '11px sans-serif';
        ctx.fillText('x', W - 14, axisY - 6); ctx.fillText('y', axisX + 8, 14);

        if (currentFn) {
            ctx.beginPath();
            ctx.strokeStyle = '#4f9fcf'; ctx.lineWidth = 2.5; ctx.lineJoin = 'round';
            let first = true;
            const step = (xMax - xMin) / W * 0.15;
            for (let mx = xMin; mx <= xMax; mx += step) {
                const my = currentFn(mx);
                if (isNaN(my) || !isFinite(my) || Math.abs(my) > 1e6) { first = true; continue; }
                const cx = toCanvasX(mx, W), cy = toCanvasY(my, H);
                if (cy < -500 || cy > H + 500) { first = true; continue; }
                first ? (ctx.moveTo(cx, cy), first = false) : ctx.lineTo(cx, cy);
            }
            ctx.stroke();

            const y0 = currentFn(pointX);
            if (isFinite(y0)) {
                pointY = y0;
                const slope = Common.numericalDerivative(currentFn, pointX);
                const px = toCanvasX(pointX, W), py = toCanvasY(y0, H);
                if (isFinite(slope)) {
                    const tx1 = toCanvasX(xMin, W), ty1 = toCanvasY(y0 + slope * (xMin - pointX), H);
                    const tx2 = toCanvasX(xMax, W), ty2 = toCanvasY(y0 + slope * (xMax - pointX), H);
                    ctx.beginPath(); ctx.strokeStyle = '#e05161'; ctx.lineWidth = 2;
                    ctx.setLineDash([8, 5]); ctx.moveTo(tx1, ty1); ctx.lineTo(tx2, ty2); ctx.stroke(); ctx.setLineDash([]);
                }
                ctx.beginPath(); ctx.fillStyle = '#e05161'; ctx.shadowColor = '#e05161'; ctx.shadowBlur = 10;
                ctx.arc(px, py, 7, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();

                document.getElementById('infoPoint').textContent = `x=${pointX.toFixed(4)}, y=${y0.toFixed(4)}`;
                document.getElementById('infoSlope').textContent = isFinite(slope) ? `m=${slope.toFixed(4)}` : 'm=未定义';
            }
        }
    }

    function getEventPos(e) { const r = getRect(); return { x: e.clientX - r.left, y: e.clientY - r.top, rect: r }; }

    canvas.addEventListener('pointerdown', function(e) {
        const pos = getEventPos(e); const W = pos.rect.width, H = pos.rect.height;
        if (e.button === 2 || (e.button === 0 && e.ctrlKey)) {
            panning = true; panStart = { ...pos, xMin, xMax, yMin, yMax };
            canvas.style.cursor = 'grabbing'; e.preventDefault(); return;
        }
        if (e.button === 0 && currentFn) {
            const px = toCanvasX(pointX, W), py = toCanvasY(pointY, H);
            if (Math.hypot(pos.x - px, pos.y - py) < 16) { draggingPoint = true; canvas.style.cursor = 'grabbing'; e.preventDefault(); }
        }
    });

    window.addEventListener('pointermove', function(e) {
        if (draggingPoint) { const pos = getEventPos(e); pointX = Math.max(xMin, Math.min(xMax, toMathX(pos.x, pos.rect.width))); draw(); }
        if (panning && panStart) {
            const pos = getEventPos(e); const W = pos.rect.width, H = pos.rect.height;
            const dx = (pos.x - panStart.x) / W * (panStart.xMax - panStart.xMin);
            const dy = (pos.y - panStart.y) / H * (panStart.yMax - panStart.yMin);
            xMin = panStart.xMin - dx; xMax = panStart.xMax - dx;
            yMin = panStart.yMin + dy; yMax = panStart.yMax + dy;
            draw();
        }
        if (!draggingPoint && !panning && currentFn) {
            const pos = getEventPos(e);
            const dist = Math.hypot(pos.x - toCanvasX(pointX, pos.rect.width), pos.y - toCanvasY(pointY, pos.rect.height));
            canvas.style.cursor = dist < 16 ? 'grab' : 'default';
        }
    });

    window.addEventListener('pointerup', function() { draggingPoint = false; panning = false; panStart = null; canvas.style.cursor = 'default'; });

    canvas.addEventListener('wheel', function(e) {
        e.preventDefault();
        const pos = getEventPos(e); const W = pos.rect.width, H = pos.rect.height;
        const mx = toMathX(pos.x, W), my = toMathY(pos.y, H);
        const zoom = e.deltaY < 0 ? 0.88 : 1.12;
        xMin = mx - (mx - xMin) * zoom; xMax = mx + (xMax - mx) * zoom;
        yMin = my - (my - yMin) * zoom; yMax = my + (yMax - my) * zoom;
        draw();
    }, { passive: false });

    canvas.addEventListener('contextmenu', e => e.preventDefault());
    window.addEventListener('resize', draw);
    if (window.ResizeObserver) new ResizeObserver(() => draw()).observe(container);

    window.applyFunction = function() {
        const expr = exprInput.value.trim();
        if (!expr) { alert('⚠️ 请输入函数表达式'); return; }
        const fn = Common.compileExpr(expr);
        if (!fn) { alert('⚠️ 表达式无效'); return; }
        currentFn = fn; pointX = 1.5; draw();
    };
    window.resetAll = function() { xMin = -5; xMax = 5; yMin = -6; yMax = 6; pointX = 1.5; draw(); };
    window.exportImage = function() {
        const link = document.createElement('a');
        link.download = 'tangent-' + new Date().toISOString().slice(0,10) + '.png';
        link.href = canvas.toDataURL('image/png'); link.click();
    };
    window.showHelp = function() {
        alert('📐 切线斜率探索器\n\n🖱️ 拖拽红点沿曲线移动\n🔍 滚轮缩放 | ✋ 右键平移\n\n支持: sin,cos,tan,exp,ln,sqrt,abs,^,+,-,*,/,()');
    };

    window.addEventListener('load', () => setTimeout(draw, 100));
})();
</script>
</body>
</html>
